services:
  postgres:
    # pgvector/pgvector:pg17 is a drop-in Postgres 17 image (same base as
    # postgres:17) with the pgvector extension's files installed — not
    # yet ENABLED in any given database until `CREATE EXTENSION vector`
    # runs (this migration's own SQL), so this swap alone changes
    # nothing for a database that never opts in. Confirmed to exist and
    # be multi-arch (amd64 + arm64) via `docker manifest inspect` before
    # committing to it, not assumed (AGENTS.md §3cc).
    image: pgvector/pgvector:pg17
    container_name: pfw_local_db
    restart: unless-stopped
    # Postgres defaults to 100 connections. Vitest runs the integration
    # project across one worker PER FILE in parallel, each opening its
    # own Prisma pool (app client + admin client), so the suite alone
    # exhausted the default once the file count passed ~145 — surfacing
    # as `Too many database connections opened` in whichever files
    # happened to start last, which reads exactly like a flaky test and
    # is not one.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: pfw_local
      POSTGRES_USER: pfw_app
      POSTGRES_PASSWORD: pfw_local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfw_app -d pfw_local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    # Celery broker + result backend for sidecar/'s async task offloading
    # (sidecar/app/celery_app.py) — a message broker and a short-TTL
    # result cache, not durable app data, so no named volume: losing it
    # on a restart just means any in-flight/recently-finished task
    # result is gone, which is exactly as consequential as it sounds for
    # a per-dashboard-load anomaly check (nothing else in this app reads
    # Redis). Standard default port (6379) — unlike postgres above,
    # nothing else on this machine was found bound to it, so there's no
    # real reason to remap.
    image: redis:8.8.2-alpine
    container_name: pfw_local_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
