name: Database backup

# Nightly encrypted logical backup of the production database, kept as a
# GitHub Actions artifact for 30 days (AGENTS.md §3yy). Neon's own
# point-in-time restore is the FIRST line of recovery; this is the copy
# that survives what that cannot: the Neon project being deleted, the
# account lapsing, the provider being changed. `scripts/db-backup.sh` does
# the work and can be run by hand with the same two variables.
#
# Secrets live in a dedicated "backup" GitHub Environment (Settings ->
# Environments -> New -> "backup"), NOT in "production": that environment
# has required reviewers, and a job that waits for a human every night at
# 03:30 never runs. "backup" has no protection rules on purpose — what
# bounds it instead is the secret itself: a connection string for the
# read-only `backup_reader` role (SELECT only, no DDL, no writes) and a
# passphrase that only ever encrypts. Both are the operator's to set:
#   BACKUP_DATABASE_URL   postgresql://backup_reader:<pw>@<direct host>/neondb?sslmode=require
#                         (the direct endpoint, not the -pooler one — pg_dump
#                         holds one long transaction, which a transaction
#                         pooler is the wrong place for)
#   BACKUP_PASSPHRASE     >= 20 characters, generated, stored in a password
#                         manager: a lost passphrase makes every artifact
#                         permanently unreadable, and nothing in this repo
#                         can recover it.
#
# Artifacts of a PUBLIC repository are downloadable by anyone with a GitHub
# account, which is why the script uploads nothing that is not encrypted
# and why the plaintext dump never leaves the runner. A failed run opens an
# issue (the `report` job below). That cannot cover a run that never starts:
# GitHub pauses scheduled workflows in a repository with no commits for 60
# days, so the run history on the Actions tab is still the check that this
# is firing at all.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Encrypted pg_dump of production
    runs-on: ubuntu-latest
    environment: backup
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Dump, encrypt and verify
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: bash scripts/db-backup.sh backup-out

      - name: Upload the encrypted archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v7.0.1
        with:
          name: pfw-db-backup-${{ github.run_id }}
          path: backup-out/*.pgdump.gpg
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

  # A failed night used to be visible only on the Actions tab, and seven in a
  # row (2026-10-05 to 2026-10-11, a table the backup role could not read) went
  # unnoticed. This turns a failure into an open issue, which GitHub emails to
  # the repository's watchers, and closes it again when a night succeeds. It is
  # its own job so it holds `issues: write` and nothing else: the backup job
  # has the database secrets and must not also be able to write to the repo.
  # The issue is public (so is the repository), and carries only the run link.
  report:
    name: Report backup status
    needs: backup
    if: always() && needs.backup.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BACKUP_RESULT: ${{ needs.backup.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update or close the failure issue
        run: |
          set -euo pipefail
          title="Nightly database backup failed"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')

          if [ "$BACKUP_RESULT" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
                --comment "A backup succeeded again: $RUN_URL"
            fi
            exit 0
          fi

          body="The nightly backup finished as \`$BACKUP_RESULT\`: $RUN_URL

          Neon's point-in-time restore is still the first line of recovery. See docs/BACKUP-RESTORE.md (a table the backup role cannot read was the cause last time)."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
