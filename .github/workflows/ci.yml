name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Mirrors compose.yaml's postgres service exactly (same db name, same two
# roles/passwords pfw_app/pfw_runtime) so this workflow behaves identically
# to local dev — see AGENTS.md §3a and docs/SECURITY.md for why there are
# two roles (pfw_app is the RLS-bypassing superuser used only for
# migrations/seeding; pfw_runtime is the restricted, RLS-subject role the
# app actually connects as). ENCRYPTION_KEY and AUTH_SECRET are both
# throwaway values that only ever exist for the lifetime of this job's
# ephemeral database/process — same spirit as the RLS migration's
# documented throwaway local dev password, not a real secret protecting
# real data. Both are allowlisted by exact fingerprint in
# .gitleaksignore for this reason — see that file's own comment.
env:
  DATABASE_URL: postgresql://pfw_app:pfw_local_dev_password@localhost:5433/pfw_local?schema=public
  APP_DATABASE_URL: postgresql://pfw_runtime:pfw_runtime_dev_password@localhost:5433/pfw_local?schema=public
  ENCRYPTION_KEY: 3KPfiH4Mh3e8dtp5gwC6WWCMJr0YYk0k0r8UCnA9V8U=
  AUTH_SECRET: MB753LAcz/vL1D9qR3NNvhuHvhJoejgFPNGokQVQBVc=

jobs:
  test:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pfw_local
          POSTGRES_USER: pfw_app
          POSTGRES_PASSWORD: pfw_local_dev_password
        ports:
          # Same host port compose.yaml uses locally (5433, not Postgres'
          # default 5432) — purely for consistency with DATABASE_URL
          # above; nothing else runs on this ephemeral runner to conflict
          # with, unlike the local-dev reason documented in compose.yaml.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pfw_app -d pfw_local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `migrate deploy`, not `migrate dev` — the latter is a local-dev
      # tool (drift detection, can prompt interactively); `deploy` just
      # applies the existing migration files non-interactively, which is
      # what CI/CD wants. This is also what creates the pfw_runtime role
      # and its RLS policies (prisma/migrations/*_rls_and_runtime_role) —
      # the integration test suite below depends on it existing.
      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Seed deterministic mock data
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs all three Vitest projects (unit, component, integration).
      # The integration project's DB-backed suites (db.test.ts,
      # idor.test.ts) run for real here, since DATABASE_URL/
      # APP_DATABASE_URL are set — see each file's `describe.skipIf` for
      # why they no-op locally without a running Postgres. The
      # embedding-sidecar integration test stays skipped here on purpose
      # (EMBEDDING_SIDECAR_URL is intentionally left unset) — the Python
      # FastAPI/ONNX sidecar is a separate service this workflow doesn't
      # stand up.
      - name: Run full Vitest suite
        run: npm run test

  gitleaks:
    name: Security · Gitleaks (credential leak scan)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Installed directly from a pinned, checksum-verified GitHub release
      # rather than the gitleaks-action wrapper: the OSS `gitleaks` CLI
      # itself is fully free (MIT), but gitleaks-action v2 gates non-public
      # repos behind a paid GITLEAKS_LICENSE secret this repo doesn't
      # provision — installing the binary directly sidesteps that entirely
      # regardless of this repo's visibility.
      - name: Install Gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      # Scans the checked-out working tree, not git history — this repo's
      # history predates this workflow, and re-litigating already-merged
      # history isn't this job's purpose (see .gitleaksignore for the one
      # already-triaged working-tree exception). --redact keeps a real
      # future finding's secret value out of the public job log even
      # though this only ever runs against this repo's own content.
      - name: Scan for leaked credentials
        run: gitleaks detect --source . --no-git --redact --verbose --exit-code 1

  semgrep:
    name: Security · Semgrep (static analysis)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.174.0
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # No SEMGREP_APP_TOKEN / Semgrep AppSec Platform login — these are
      # public, community-maintained rulesets pulled from the Semgrep
      # Registry (https://semgrep.dev/r), which needs no token. --metrics=off
      # opts out of anonymous usage telemetry.
      - name: Run Semgrep
        run: >-
          semgrep scan
          --config=p/security-audit
          --config=p/typescript
          --config=p/react
          --config=p/secrets
          --config=p/owasp-top-ten
          --error
          --metrics=off
